<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="main">
      <nav class="navbar">
        <span><img src="images/logo.svg" alt="logo" /></span>
        <div class="lists">
          <button class="language">English</button>
          <button class="signin">Sign In</button>
        </div>
      </nav>
      <div class="box"></div>
      <div class="hero">
        <span>Unlimited movies,</span>
        <span>shows, and more </span>
        <span>Starts at ₹149. Cancel at any time.</span>
        <button>Restart your membership ></button>
      </div>
    </div>
    <div class="trend">Trending Now</div>
    <div class="movies">
      <img class="poster"src="images/img1.jpg" />
      <img class="poster"src="images/img2.jpg" />
      <img class="poster"src="images/img3.jpg" />
      <img class="poster"src="images/img4.jpg" />
      <img class="poster"src="images/img5.jpg" />
      <button class="side-arrow">
        <span>&#8250;</span>
      </button>
    </div>
  </body>
</html>
